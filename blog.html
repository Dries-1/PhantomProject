<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - Phantom</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <style>
        /* Algemene stijl */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
            background: #f4f4f4;
        }

        /* Header */
        header {
            background: #fff;
            color: #38761d;
            padding: 15px;
            text-align: center;
            font-size: 26px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        /* Navigatiebalk */
        nav {
            background: #6aa84f;
            padding: 12px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            margin: 0 15px;
            padding: 8px 12px;
            transition: background 0.3s, border-radius 0.3s;
            border-radius: 5px;
        }
        nav a:hover {
            background: #38761d;
            border-radius: 5px;
        }

        /* Hoofdinhoud */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 1200px;
            margin: 20px auto;
        }

        .content {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            width: 80%;
            max-width: 800px;
        }

        .blog-post img {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .blog-post h1 {
            color: #38761d;
            text-align: center;
        }

        .blog-post .date {
            font-size: 0.9em;
            color: #888;
            text-align: center;
            margin-bottom: 20px;
        }

        .blog-post p {
            color: #555;
            text-align: justify;
        }

        /* Sidebar */
        .sidebar {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        .sidebar img {
            width: 250px;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            border: 3px solid #6aa84f;
        }

        /* Footer */
        footer {
            background: #333;
            color: #fff;
            text-align: center;
            padding: 10px 0;
            font-size: 10px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>
    <header>
        BLOG - Phantom
    </header>
    <nav>
        <a href="index.html">Home</a>
        <a href="over.html">Over ons</a>
        <a href="blog.html">Blog</a>
        <a href="project.html">Project</a>
        <a href="contact.html">Contact</a>
        <a href="winddatapage.html">Winddata</a>
    </nav>

    <div class="container">
        <div class="content">
            <article class="blog-post">
                <img src="afbeeldingblog.jpeg" alt="Hoofdafbeelding van de blogpost">
                <h1>Titel van de blogpost</h1>
                <p class="date">Gepubliceerd door Phantom</p>
                <p>
                    Inleiding...
                </p>
                <p>
                    Hoofdtekst...
                </p>
                <p>
                    Tot slot...
                </p>
            </article>
        </div>

        <div class="sidebar">
            <img src="sfeerbeeldbuitencrop.jpg" alt="Sfeerbeeld buiten">
            <img src="sfeerbeeldzijkant.jpg" alt="Sfeerbeeld 2">
            <img src="sfeerbeeld3.jpg" alt="Sfeerbeeld 3">
        </div>
    </div>

    <footer>
        &copy; 2025 Phantom. Alle rechten voorbehouden.
    </footer>
</body>
</html>
