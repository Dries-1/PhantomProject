<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - Phantom</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background: #333;
            color: #fff;
            padding: 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }

        .container {
            display: flex;
            max-width: 1200px;
            width: 100%;
            margin: 20px auto;
            flex: 1;
        }

        nav {
            background: #444;
            padding: 15px;
            width: 200px;
            display: flex;
            flex-direction: column;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            margin: 10px 0;
            font-weight: bold;
            transition: color 0.3s;
            display: block;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .content-wrapper {
            display: flex;
            align-items: stretch;
            gap: 20px;
            flex-grow: 1;
        }

        .content, .sidebar {
            padding: 20px;
            border-radius: 0px;
        }

        .content {
            flex-grow: 2;
            background: #f4f4f4;
        }

        .sidebar {
            width: 300px;
            background: #ddd;
        }

        .sidebar img {
            width: 100%;
            height: auto;
            max-height: 250px;
            object-fit: cover;
        }

        .blog-post img {
            width: 100%;
            display: block;
            margin: 20px auto;
        }

        .blog-post h1 {
            color: #333;
            text-align: center;
        }

        .blog-post p {
            color: #555;
            text-align: justify;
        }

        .blog-post .date {
            font-size: 0.9em;
            color: #888;
            text-align: center;
            margin-bottom: 20px;
        }

        footer {
            background: #333;
            color: #fff;
            text-align: center;
            padding: 10px;
            font-size: 12px;
            width: 100%;
            margin-top: auto;
        }
    </style>
</head>
<body>
    <header>
        BLOG - Phantom
    </header>

    <div class="container">
        <nav>
            <a href="index.html">Home</a>
            <a href="over.html">Over ons</a>
            <a href="blog.html">Blog</a>
            <a href="project.html">Project</a>
            <a href="contact.html">Contact</a>
            <a href="winddatapage.html">Winddata</a>
        </nav>

        <div class="content-wrapper">
            <div class="content">
                <article class="blog-post">
                    <img src="afbeeldingblog.jpeg" alt="Hoofdafbeelding van de blogpost">
                    <h1>Titel van de blogpost</h1>
                    <p class="date">Gepubliceerd door Phantom</p>
                    <p>
                        Inleiding...
                    </p>
                    <p>
                        Hoofdtekst...
                    </p>
                    <p>
                        Tot slot...
                    </p>
                </article>
            </div>

            <div class="sidebar">
                <img src="sfeerbeeldbuitencrop.jpg" alt="Sfeerbeeld buiten">
                <img src="sfeerbeeldzijkant.jpg" alt="Sfeerbeeld 2">
                <img src="sfeerbeeld3.jpg" alt="Sfeerbeeld 3">
            </div>
        </div>
    </div>

    <footer>
        &copy; 2025 Phantom. Alle rechten voorbehouden.
    </footer>
</body>
</html>
