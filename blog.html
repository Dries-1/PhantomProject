<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - Phantom</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <style>
        /* Algemene stijl */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
            background: #f4f4f4;
        }

        /* Header */
        header {
            background: #2a6d4f; /* Groene header kleur */
            color: #fff;
            padding: 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }

        /* Navigatiebalk */
        nav {
            background: #1f4c3d; /* Groene nav kleur */
            padding: 12px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            margin: 0 15px;
            padding: 8px 12px;
            transition: background 0.3s, border-radius 0.3s;
            border-radius: 5px;
        }
        nav a:hover {
            background: #38761d; /* Groene hover kleur */
            border-radius: 5px;
        }

        /* Hoofdinhoud */
        .container {
            display: flex;
            max-width: 1200px;
            width: 100%;
            margin: 20px auto;
            flex: 1;
        }

        /* Content gedeelte */
        .content-wrapper {
            display: flex;
            align-items: stretch;
            gap: 20px;
            flex-grow: 1;
        }

        .content {
            padding: 20px;
            background: #fff;
            border-radius: 10px;
            flex-grow: 2;
        }

        /* Sidebar */
        .sidebar {
            width: 300px;
            background: #ddd;
            padding: 20px;
            border-radius: 10px;
        }

        .sidebar img {
            width: 100%;
            height: auto;
            max-height: 250px;
            object-fit: cover;
        }

        /* Blog post */
        .blog-post h1 {
            color: #2a6d4f; /* Groene tekstkleur voor de titel */
            text-align: center;
        }

        .blog-post p {
            color: #555;
            text-align: justify;
        }

        .blog-post .date {
            font-size: 0.9em;
            color: #888;
            text-align: center;
            margin-bottom: 20px;
        }

        /* Footer */
        footer {
            background: #2a6d4f; /* Groene footer kleur */
            color: #fff;
            text-align: center;
            padding: 10px;
            font-size: 12px;
            width: 100%;
            margin-top: auto;
        }
    </style>
</head>
<body>
    <header>
        BLOG - Phantom
    </header>

    <div class="container">
        <nav>
            <a href="index.html">Home</a>
            <a href="over.html">Over ons</a>
            <a href="blog.html">Blog</a>
            <a href="project.html">Project</a>
            <a href="contact.html">Contact</a>
            <a href="winddatapage.html">Winddata</a>
        </nav>

        <div class="content-wrapper">
            <div class="content">
                <article class="blog-post">
                    <img src="afbeeldingblog.jpeg" alt="Hoofdafbeelding van de blogpost">
                    <h1>Titel van de blogpost</h1>
                    <p class="date">Gepubliceerd door Phantom</p>
                    <p>
                        Inleiding...
                    </p>
                    <p>
                        Hoofdtekst...
                    </p>
                    <p>
                        Tot slot...
                    </p>
                </article>
            </div>

            <div class="sidebar">
                <img src="sfeerbeeldbuitencrop.jpg" alt="Sfeerbeeld buiten">
                <img src="sfeerbeeldzijkant.jpg" alt="Sfeerbeeld 2">
                <img src="sfeerbeeld3.jpg" alt="Sfeerbeeld 3">
            </div>
        </div>
    </div>

    <footer>
        &copy; 2025 Phantom. Alle rechten voorbehouden.
    </footer>
</body>
</html>
