<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - Phantom</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            line-height: 1.6;
        }

        header {
            background: url('header-image.jpg') center/cover;
            color: #fff;
            padding: 40px 0;
            text-align: center;
            font-size: 2em;
            font-weight: bold;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.5);
        }

        nav {
            background: #444;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #ff9800;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .blog-post img {
            width: 80%;
            display: block;
            margin: 20px auto;
            border-radius: 10px;
        }

        .blog-post h1 {
            color: #333;
            text-align: center;
        }

        .blog-post p {
            color: #555;
            text-align: justify;
        }

        .blog-post .date {
            font-size: 0.9em;
            color: #888;
            text-align: center;
            margin-bottom: 20px;
        }

        .sfeerbeelden {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 30px;
        }

        .sfeerbeelden img {
            width: 30%;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        footer {
            background: #333;
            color: #fff;
            text-align: center;
            padding: 15px 0;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <header>
        BLOG - Phantom
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="over.html">Over ons</a>
        <a href="blog.html">Blog</a>
        <a href="project.html">Project</a>
        <a href="contact.html">Contact</a>
    </nav>

    <div class="container">
        <article class="blog-post">
            <img src="afbeeldingblog.jpeg" alt="Hoofdafbeelding van de blogpost">
            <h1>Titel van de blogpost</h1>
            <p class="date">Gepubliceerd door Phantom</p>
            <p>
                Inleiding...
            </p>
            <p>
                Hoofdtekst...
            </p>
            <p>
                Tot slot...
            </p>
        </article>

        <div class="sfeerbeelden">
            <img src="sfeerbeeld1.jpg" alt="Sfeerbeeld 1">
            <img src="sfeerbeeld2.jpg" alt="Sfeerbeeld 2">
            <img src="sfeerbeeld3.jpg" alt="Sfeerbeeld 3">
        </div>
    </div>

    <footer>
        &copy; 2025 Phantom. Alle rechten voorbehouden.
    </footer>
</body>
</html>
