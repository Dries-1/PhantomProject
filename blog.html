<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - Phantom</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <style>
        /* Algemene stijl */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
            background: #f4f4f4;
            display: flex;
        }

        /* Navigatiebalk links */
        nav {
            background: #6aa84f;
            padding: 20px;
            width: 200px;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
        }
        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            margin: 10px 0;
            padding: 10px;
            transition: background 0.3s, border-radius 0.3s;
            border-radius: 5px;
            display: block;
        }
        nav a:hover {
            background: #38761d;
            border-radius: 5px;
        }

        /* Hoofdcontainer */
        .container {
            max-width: 1200px;
            width: 100%;
            margin: 20px auto;
            display: flex;
            flex-direction: column;
            margin-left: 220px;
        }

        /* Header */
        header {
            background: #38761d;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 26px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            margin-left: 200px;
        }

        /* Content-wrapper */
        .content-wrapper {
            display: flex;
            gap: 20px;
            flex-grow: 1;
        }

        /* Blog content */
        .content {
            padding: 20px;
            background: #ddd; /* Zelfde grijs als de sfeerfotobox */
            border-radius: 10px;
            flex-grow: 2;
        }

        /* Sidebar */
        .sidebar {
            width: 300px;
            background: #ddd; /* Zelfde grijs als de sfeerfotobox */
            padding: 20px;
            border-radius: 10px;
        }

        .sidebar img {
            width: 100%;
            height: auto;
            max-height: 250px;
            object-fit: cover;
            margin-bottom: 10px;
        }

        /* Blogpost styling */
        .blog-post h1 {
            color: #38761d;
            text-align: center;
        }

        .blog-post p {
            color: #555;
            text-align: justify;
        }

        .blog-post .date {
            font-size: 0.9em;
            color: #888;
            text-align: center;
            margin-bottom: 20px;
        }

        /* Footer */
        footer {
            background: #333;
            color: #fff;
            text-align: center;
            padding: 10px;
            font-size: 12px;
            width: 100%;
            margin-top: 50px;
            margin-left: 200px;
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html">Home</a>
        <a href="over.html">Over ons</a>
        <a href="blog.html">Blog</a>
        <a href="project.html">Project</a>
        <a href="contact.html">Contact</a>
        <a href="winddatapage.html">Winddata</a>
    </nav>

    <header>
        BLOG - Phantom
    </header>

    <div class="container">
        <div class="content-wrapper">
            <div class="content">
                <article class="blog-post">
                    <img src="afbeeldingblog.jpeg" alt="Hoofdafbeelding van de blogpost">
                    <h1>Titel van de blogpost</h1>
                    <p class="date">Gepubliceerd door Phantom</p>
                    <p>
                        Inleiding...
                    </p>
                    <p>
                        Hoofdtekst...
                    </p>
                    <p>
                        Tot slot...
                    </p>
                </article>
            </div>

            <div class="sidebar">
                <img src="sfeerbeeldbuitencrop.jpg" alt="Sfeerbeeld buiten">
                <img src="sfeerbeeldzijkant.jpg" alt="Sfeerbeeld 2">
                <img src="sfeerbeeld3.jpg" alt="Sfeerbeeld 3">
            </div>
        </div>
    </div>

    <footer>
        &copy; 2025 Phantom. Alle rechten voorbehouden.
    </footer>

</body>
</html>
