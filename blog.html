<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - Phantom</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <style>
        /* Algemene stijl */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            background: #f4f4f4;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Header */
        header {
            background: #38761d;
            color: #fff;
            padding: 20px;
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        /* Layout */
        .container {
            display: flex;
            max-width: 1200px;
            width: 100%;
            margin: 30px auto;
            gap: 30px;
            flex-grow: 1;
        }

        /* Content gedeelte */
        .content {
            flex: 2;
            padding: 25px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        /* Blog post */
        .blog-post img {
            width: 100%;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .blog-post h1 {
            color: #38761d;
            text-align: center;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .blog-post .date {
            font-size: 0.9em;
            color: #888;
            text-align: center;
            margin-bottom: 20px;
        }

        .blog-post p {
            color: #555;
            text-align: justify;
            font-size: 16px;
            margin-bottom: 15px;
        }

        /* Sidebar (navigatie rechts) */
        .sidebar {
            width: 270px;
            background: #ddd;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .sidebar img {
            width: 100%;
            height: auto;
            margin-bottom: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        /* Navigatiebalk rechts */
        nav {
            background: #6aa84f;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        nav a {
            display: block;
            color: white;
            text-decoration: none;
            font-weight: bold;
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            transition: background 0.3s;
        }

        nav a:hover {
            background: #38761d;
        }

        /* Footer */
        footer {
            background: #333;
            color: #fff;
            text-align: center;
            padding: 15px;
            font-size: 14px;
            margin-top: auto;
        }
    </style>
</head>
<body>
    <header>
        BLOG - Phantom
    </header>

    <div class="container">
        <!-- Hoofdcontent -->
        <div class="content">
            <article class="blog-post">
                <img src="afbeeldingblog.jpeg" alt="Hoofdafbeelding van de blogpost">
                <h1>Titel van de blogpost</h1>
                <p class="date">Gepubliceerd door Phantom</p>
                <p>Inleiding...</p>
                <p>Hoofdtekst...</p>
                <p>Tot slot...</p>
            </article>
        </div>

        <!-- Sidebar met navigatie en extra afbeeldingen -->
        <aside class="sidebar">
            <nav>
                <a href="index.html">Home</a>
                <a href="over.html">Over ons</a>
                <a href="blog.html">Blog</a>
                <a href="project.html">Project</a>
                <a href="contact.html">Contact</a>
                <a href="winddatapage.html">Winddata</a>
            </nav>
            <img src="sfeerbeeldbuitencrop.jpg" alt="Sfeerbeeld buiten">
            <img src="sfeerbeeldzijkant.jpg" alt="Sfeerbeeld 2">
            <img src="sfeerbeeld3.jpg" alt="Sfeerbeeld 3">
        </aside>
    </div>

    <footer>
        &copy; 2025 Phantom. Alle rechten voorbehouden.
    </footer>
</body>
</html>
