<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - Phantom</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #ccc;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            background: url('header-image.jpg') center/cover;
            color: #444;
            padding: 40px 0;
            text-align: center;
            font-size: 2em;
            font-weight: bold;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.5);
            width: 100%;
            border-radius: 10px;
        }

        .container {
            display: flex;
            max-width: 1200px;
            width: 100%;
            margin: 20px;
        }

        nav {
            background: #444;
            padding: 15px;
            width: 200px;
            text-align: left;
            display: flex;
            flex-direction: column;
            border-radius: 10px;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            margin: 10px 0;
            font-weight: bold;
            transition: color 0.3s;
            display: block;
        }

        nav a:hover {
            color: #ff9800;
        }

        .content-wrapper {
            display: flex;
            flex-grow: 1;
            margin-left: 20px;
        }

        .content, .sidebar {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            border: 2px solid #ccc;
        }

        .content {
            flex-grow: 2;
            margin-right: 20px;
        }

        .sidebar {
            width: 300px;
        }

        .sidebar img {
            width: 100%;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .blog-post img {
            width: 100%;
            display: block;
            margin: 20px auto;
            border-radius: 10px;
        }

        .blog-post h1 {
            color: #333;
            text-align: center;
        }

        .blog-post p {
            color: #555;
            text-align: justify;
        }

        .blog-post .date {
            font-size: 0.9em;
            color: #888;
            text-align: center;
            margin-bottom: 20px;
        }

        footer {
            background: #333;
            color: #fff;
            text-align: center;
            padding: 15px 0;
            font-size: 12px;
            width: 100%;
            margin-top: 20px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <header>
        BLOG - Phantom
    </header>

    <div class="container">
        <nav>
            <a href="index.html">Home</a>
            <a href="over.html">Over ons</a>
            <a href="blog.html">Blog</a>
            <a href="project.html">Project</a>
            <a href="contact.html">Contact</a>
        </nav>

        <div class="content-wrapper">
            <div class="content">
                <article class="blog-post">
                    <img src="afbeeldingblog.jpeg" alt="Hoofdafbeelding van de blogpost">
                    <h1>Titel van de blogpost</h1>
                    <p class="date">Gepubliceerd door Phantom</p>
                    <p>
                        Inleiding...
                    </p>
                    <p>
                        Hoofdtekst...
                    </p>
                    <p>
                        Tot slot...
                    </p>
                </article>
            </div>

            <div class="sidebar">
                <img src="sfeerbeeldBuiten.jpg" alt="Sfeerbeeld buiten">
                <img src="sfeerbeeld2.jpg" alt="Sfeerbeeld 2">
                <img src="sfeerbeeld3.jpg" alt="Sfeerbeeld 3">
            </div>
        </div>
    </div>

    <footer>
        &copy; 2025 Phantom. Alle rechten voorbehouden.
    </footer>
</body>
</html>
