<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - Phantom</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <style>
        /* Algemene stijl */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Header */
        header {
            background: #fff;
            color: #38761d;
            padding: 15px;
            text-align: center;
            font-size: 26px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        /* Navigatiebalk links */
        nav {
            background: #6aa84f;
            width: 200px;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            padding-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
        }
        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            padding: 10px 15px;
            width: 100%;
            text-align: center;
            display: block;
            transition: background 0.3s, border-radius 0.3s;
        }
        nav a:hover {
            background: #38761d;
            border-radius: 5px;
        }

        /* Content */
        .container {
            display: flex;
            margin-left: 220px;
            padding: 20px;
            flex-grow: 1;
        }

        .blog-content {
            flex: 2;
            background: #e6e6e6; /* Zelfde kleur als de sfeerfotobox */
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .blog-content h1 {
            color: #38761d;
            text-align: center;
        }

        .blog-content p {
            color: #555;
            text-align: justify;
        }

        /* Sidebar */
        .sidebar {
            flex: 1;
            padding: 20px;
            background: #e6e6e6;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            margin-left: 20px;
        }

        .sidebar img {
            width: 100%;
            height: auto;
            margin-bottom: 10px;
        }

        /* Footer */
        footer {
            background: #333;
            color: #fff;
            text-align: center;
            padding: 10px;
            font-size: 12px;
            margin-top: auto;
            width: 100%;
        }
    </style>
</head>
<body>
    <header>
        BLOG - Phantom
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="over.html">Over ons</a>
        <a href="blog.html">Blog</a>
        <a href="project.html">Project</a>
        <a href="contact.html">Contact</a>
        <a href="winddatapage.html">Winddata</a>
    </nav>

    <div class="container">
        <div class="blog-content">
            <h1>Titel van de blogpost</h1>
            <p class="date">Gepubliceerd door Phantom</p>
            <p>Inleiding...</p>
            <p>Hoofdtekst...</p>
            <p>Tot slot...</p>
        </div>

        <div class="sidebar">
            <img src="sfeerbeeldbuitencrop.jpg" alt="Sfeerbeeld buiten">
            <img src="sfeerbeeldzijkant.jpg" alt="Sfeerbeeld 2">
            <img src="sfeerbeeld3.jpg" alt="Sfeerbeeld 3">
        </div>
    </div>

    <footer>
        &copy; 2025 Phantom. Alle rechten voorbehouden.
    </footer>
</body>
</html>
