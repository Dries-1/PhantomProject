<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Phantom</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon"> 
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
            background-color: #f4f4f4;
            color: #000000;
        }
        header {
            background: #333;
            color: #fff;
            padding: 10px 15px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
        }
        nav {
            background: #444;
            color: #fff;
            padding: 10px;
            text-align: center;
        }
        nav a {
            color: #fff;
            text-decoration: none;
            margin: 0 10px;
        }
        nav a:hover {
            color: #ffcc00;
        }
        .container {
            max-width: 800px;
            margin: 20px auto;
            background: #ffffff;
            padding: 20px;
            box-shadow: 0 0 15px rgb(200, 200, 200);
            border-radius: 10px;
        }
        .contact-form label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }
        .contact-form input, 
        .contact-form textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .contact-form button {
            background: #444;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 15px;
        }
        .contact-form button:hover {
            background: #ffcc00;
            color: #000000;
        }
        footer {
            background: #333;
            color: #fff;
            text-align: center;
            padding: 10px 0;
            font-size: 12px;
            position: fixed;
            width: 100%;
            bottom: 0;
        }
    </style>
</head>
<body>
    <header>
        <h1>Neem contact op</h1>
    </header>
    <nav>
        <a href="index.html">Home</a>
        <a href="over.html">Over ons</a>
        <a href="fotos.html">Foto's</a>
        <a href="project.html">Project</a>
    </nav>
    
    <div class="container">
        <h2>Contactformulier</h2>
        <form class="contact-form">
            <label for="name">Naam:</label>
            <input type="text" id="name" name="name" required>
            
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" required>
            
            <label for="message">Bericht:</label>
            <textarea id="message" name="message" rows="5" required></textarea>
            
            <button type="submit">Verstuur</button>
        </form>
    </div>
    
    <footer>
        &copy; 2025 Phantom Website. Alle rechten voorbehouden.
    </footer>
</body>
</html>
