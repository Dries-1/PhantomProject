<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foto's - Phantom</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        header {
            background: #333;
            color: #fff;
            padding: 10px 20px;
            text-align: center;
        }
        nav {
            background: #444;
            color: #fff;
            padding: 10px;
            text-align: center;
        }
        nav a {
            color: #fff;
            text-decoration: none;
            margin: 0 10px;
        }
        nav a:hover {
            text-decoration: underline;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            padding: 20px;
        }
        .photo {
            text-align: center;
            background: #f4f4f4;
            padding: 10px;
            border: 1px solid #ddd;
        }
        .photo img {
            width: 100%;
            max-width: 300px;
            height: auto;
            border-radius: 5px;
        }
        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #333;
            color: #fff;
            text-align: center;
            padding: 10px 0;
        }
    </style>
</head>
<body>
    <header>
        <h1>Foto's - Phantom</h1>
    </header>
    <nav>
        <a href="index.html">Home</a>
        <a href="over.html">Over ons</a>
        <a href="fotos.html">Foto's</a>
        <a href="project.html">Project</a>
    </nav>
    <section class="gallery">
        <div class="photo">
            <img src="foto1.jpg" alt="Foto 1">
            <p>Beschrijving van foto 1</p>
        </div>
        <div class="photo">
            <img src="foto2.jpg" alt="Foto 2">
            <p>Beschrijving van foto 2</p>
        </div>
        <div class="photo">
            <img src="foto3.jpg" alt="Foto 3">
            <p>Beschrijving van foto 3</p>
        </div>
        <div class="photo">
            <img src="foto4.jpg" alt="Foto 4">
            <p>Beschrijving van foto 4</p>
        </div>
    </section>
    <footer>
        <p>&copy; 2024 Phantom Website. Alle rechten voorbehouden.</p>
    </footer>
</body>
</html>
