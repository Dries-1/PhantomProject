<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grafieken - Phantom</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f4f4f4;
        }
        header {
            background: #fff;
            color: #38761d;
            padding: 15px;
            text-align: center;
            font-size: 26px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        nav {
            background: #6aa84f;
            padding: 12px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            margin: 0 15px;
            padding: 8px 12px;
            transition: background 0.3s, border-radius 0.3s;
            border-radius: 5px;
        }
        nav a:hover {
            background: #38761d;
            border-radius: 5px;
        }
        .container {
            width: 80%;
            margin: auto;
            text-align: center;
            padding: 20px;
        }
        button {
            background: #6aa84f;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            margin: 20px;
        }
        button:hover {
            background: #38761d;
        }
        .chart-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            margin-top: 20px;
        }
        canvas {
            width: 100%;
            max-height: 400px;
        }
        footer {
            background: #333;
            color: #fff;
            text-align: center;
            padding: 10px 0;
            font-size: 10px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>
    <header>Grafieken - Phantom</header>
    <nav>
        <a href="index.html">Home</a>
        <a href="over.html">Over ons</a>
        <a href="blog.html">Blog</a>
        <a href="project.html">Project</a>
        <a href="contact.html">Contact</a>
        <a href="winddata.html">Winddata</a>
        <a href="grafiek.html">Grafieken</a>
    </nav>
 
    <div class="container">
        <h2>Wind- en Temperatuur Grafieken</h2>
        <button id="startBtn">Genereer Grafieken</button>
 
        <div class="chart-container">
            <h3>Temperatuur Grafiek</h3>
            <canvas id="tempChart"></canvas>
        </div>
 
        <div class="chart-container">
            <h3>Windsnelheid Grafiek</h3>
            <canvas id="windChart"></canvas>
        </div>
    </div>
 
    <footer>&copy; 2025 Phantom. Alle rechten voorbehouden.</footer>
 
    <script src="grafiek.js"></script>
</body>
</html>
