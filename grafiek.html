<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grafieken - Phantom</title>
<link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>

    body {

        font-family: Arial, sans-serif;

        margin: 0;

        padding: 0;

        background: #f4f4f4;

    }

    header {

        background: #fff;

        color: #38761d;

        padding: 15px;

        text-align: center;

        font-size: 26px;

        font-weight: bold;

        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);

    }

    nav {

        background: #6aa84f;

        padding: 12px;

        text-align: center;

        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);

    }

    nav a {

        color: white;

        text-decoration: none;

        font-weight: bold;

        margin: 0 15px;

        padding: 8px 12px;

        transition: background 0.3s, border-radius 0.3s;

        border-radius: 5px;

    }

    nav a:hover {

        background: #38761d;

        border-radius: 5px;

    }

    .container {

        width: 80%;

        margin: auto;

        text-align: center;

        padding: 20px;

    }

    canvas {

        background: white;

        border-radius: 10px;

        padding: 10px;

        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);

        margin-top: 20px;

        max-width: 90%;

    }

    button {

        background: #6aa84f;

        color: white;

        border: none;

        padding: 10px 20px;

        font-size: 16px;

        cursor: pointer;

        border-radius: 5px;

        margin: 20px;

    }

    button:hover {

        background: #38761d;

    }

    footer {

        background: #333;

        color: #fff;

        text-align: center;

        padding: 10px 0;

        font-size: 10px;

        position: fixed;

        bottom: 0;

        width: 100%;

    }
</style>
</head>
<body>
<header>

    Grafieken - Phantom
</header>
<nav>
<a href="index.html">Home</a>
<a href="over.html">Over ons</a>
<a href="blog.html">Blog</a>
<a href="project.html">Project</a>
<a href="contact.html">Contact</a>
<a href="winddatapage.html">Winddata</a>
<a href="grafiek.html">Grafieken</a>
</nav>
<div class="container">
<h2>Weergave van Winddata</h2>
<button id="startBtn">Start</button>
<h3>Temperatuur</h3>
<canvas id="tempChart"></canvas>
<h3>Windsnelheid</h3>
<canvas id="windChart"></canvas>
</div>
<footer>
&copy; 2025 Phantom. Alle rechten voorbehouden.
</footer>
<script>

    document.getElementById("startBtn").addEventListener("click", loadCharts);
 
    async function loadCharts() {

        const url = "https://raw.githubusercontent.com/JohnaaQS/ICT-projecten/main/Programma/weather_data.csv";

        try {

            const response = await fetch(url);

            const data = await response.text();

            const rows = data.split("\n").map(row => row.split(","));

            const labels = rows.slice(1).map(row => row[0]); // Datum/tijd

            const tempData = rows.slice(1).map(row => parseFloat(row[1])); // Temperatuur

            const windData = rows.slice(1).map(row => parseFloat(row[2])); // Windsnelheid

            createChart("tempChart", "Temperatuur (°C)", labels, tempData, "rgba(255, 99, 132, 0.6)");

            createChart("windChart", "Windsnelheid (km/h)", labels, windData, "rgba(54, 162, 235, 0.6)");

        } catch (error) {

            console.error("Fout bij ophalen van CSV:", error);

        }

    }
 
    function createChart(canvasId, label, labels, data, color) {

        const ctx = document.getElementById(canvasId).getContext("2d");

        new Chart(ctx, {

            type: "line",

            data: {

                labels: labels,

                datasets: [{

                    label: label,

                    data: data,

                    backgroundColor: color,

                    borderColor: color,

                    borderWidth: 2,

                    fill: false,

                }]

            },

            options: {

                responsive: true,

                maintainAspectRatio: false

            }

        });

    }
</script>
</body>
</html>
