<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phantom Project</title>
    <style>
        /* Algemene stijlen */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        nav {
            background-color: #333;
            color: white;
            height: 50px; /* Maak de balk kleiner */
            line-height: 50px; /* Centreer tekst verticaal */
            display: flex;
            justify-content: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 0 15px;
            font-size: 14px; /* Verklein het lettertype */
        }

        nav a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            nav {
                height: 50px; /* Zorg dat de balk op mobiel kleiner blijft */
                line-height: 50px;
            }

            nav a {
                font-size: 12px; /* Nog kleiner voor mobiele apparaten */
            }
        }

        .container {
            padding: 20px;
        }

        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px 0;
            position: fixed;
            bottom: 0;
            width: 100%;
        }

        .info, .advertenties {
            display: inline-block;
            width: 45%;
            vertical-align: top;
            margin: 20px;
        }

        .info {
            text-align: left;
        }

        .advertenties {
            text-align: right;
        }

        .advertenties img {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <nav>
        <a href="#">Home</a>
        <a href="#">Over ons</a>
        <a href="#">Foto's</a>
        <a href="#">Project</a>
    </nav>

    <div class="container">
        <h1>Welkom op de officiële website van project Phantom</h1>
        <div class="info">
            <h2>INFO</h2>
            <p>...</p>
        </div>
        <div class="advertenties">
            <h2>Advertenties:</h2>
            <img src="https://via.placeholder.com/300x150" alt="Advertentie">
        </div>
    </div>

    <footer>
        &copy; 2024 Phantom Website. Alle rechten voorbehouden.
    </footer>
</body>
</html>
