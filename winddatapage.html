<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Winddata - Phantom</title>
<link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
<style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f4f4f4;
            display: flex;
        }

        /* Navigatiebalk links */
        nav {
            background: #6aa84f;
            padding: 20px;
            width: 200px;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            margin: 10px 0;
            padding: 10px;
            width: 100%;
            text-align: center;
            transition: background 0.3s, border-radius 0.3s;
            border-radius: 5px;
        }
        nav a:hover {
            background: #38761d;
            border-radius: 5px;
        }

        /* Hoofdinhoud */
        .container {
            flex: 1;
            margin-left: 220px; /* Ruimte voor de navigatiebalk */
            padding: 20px;
            text-align: center;
        }

        /* Header */
        header {
            background: #fff;
            color: #38761d;
            padding: 15px;
            text-align: center;
            font-size: 26px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        /* Tabelstijl */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: white;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            border: 3px solid #38761d;
        }
        th, td {
            border: 1px solid #6aa84f;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #6aa84f;
            color: white;
        }

        /* Footer (nu dynamisch onder content) */
        footer {
            background: #333;
            color: #fff;
            text-align: center;
            padding: 10px;
            font-size: 12px;
            width: 100%;
            margin-top: 20px;
        }

</style>
</head>
<body>

<nav>
    <a href="index.html">Home</a>
    <a href="over.html">Over ons</a>
    <a href="blog.html">Blog</a>
    <a href="project.html">Project</a>
    <a href="contact.html">Contact</a>
    <a href="winddata.html">Winddata</a>
</nav>

<div class="container">
    <header>
        Winddata - Phantom
    </header>

    <h2>Live Winddata</h2>
    <div id="csv-container">Laden...</div>
</div>

<footer>
    &copy; 2025 Phantom. Alle rechten voorbehouden.
</footer>

<script>
        async function fetchCSV() {
            const url = "https://raw.githubusercontent.com/JohnaaQS/ICT-projecten/main/Programma/weather_data.csv";
            try {
                const response = await fetch(url);
                const data = await response.text();
                const rows = data.split("\n").map(row => row.split(","));
                let table = "<table><tr>";
                table += rows[0].map(header => `<th>${header}</th>`).join("") + "</tr>";
                for (let i = 1; i < rows.length; i++) {
                    if (rows[i].length > 1) {
                        table += "<tr>" + rows[i].map(cell => `<td>${cell}</td>`).join("") + "</tr>";
                    }
                }
                table += "</table>";
                document.getElementById("csv-container").innerHTML = table;
            } catch (error) {
                console.error("Fout bij ophalen van CSV:", error);
                document.getElementById("csv-container").innerHTML = "Er is een fout opgetreden bij het laden van de gegevens.";
            }
        }
        window.onload = fetchCSV;
</script>

</body>
</html>
